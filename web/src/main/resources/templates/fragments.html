<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title th:text="${title} + ' · CSLSM'">CSLSM</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/app.js}" defer></script>
</head>

<body>

<!-- Top bar: brand, menu (mirrors the server-side rules), signed-in user -->
<header th:fragment="topbar(active)" class="topbar">
  <a class="brand" th:href="@{/}">CSLSM</a>
  <nav class="menu" aria-label="Main">
    <a th:href="@{/daily-logs}" th:classappend="${active == 'daily-logs'} ? 'active'">Daily logs</a>
    <a th:href="@{/expenses}" th:classappend="${active == 'expenses'} ? 'active'">Expenses</a>
    <a sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')" th:href="@{/today}" th:classappend="${active == 'today'} ? 'active'">Today</a>
    <a sec:authorize="hasAnyRole('RESTAURANT_MANAGER','ADMIN','SUPER_ADMIN')" th:href="@{/restaurant}" th:classappend="${active == 'restaurant'} ? 'active'">Tiki Taka</a>
    <a sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')" th:href="@{/salon}" th:classappend="${active == 'salon'} ? 'active'">Salon</a>
    <a sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')" th:href="@{/dashboard}"
       th:classappend="${active == 'dashboard'} ? 'active'">Dashboard</a>
    <a sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')" th:href="@{/income}"
       th:classappend="${active == 'income'} ? 'active'">Income</a>
    <a sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')" th:href="@{/activities}"
       th:classappend="${active == 'activities'} ? 'active'">Activities</a>
    <a sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')" th:href="@{/reports}"
       th:classappend="${active == 'reports'} ? 'active'">Reports</a>
    <a sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')" th:href="@{/employees}"
       th:classappend="${active == 'employees'} ? 'active'">Staff</a>
    <a sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')" th:href="@{/reserves}"
       th:classappend="${active == 'reserves'} ? 'active'">Cash &amp; Reserves</a>
    <a sec:authorize="hasRole('SUPER_ADMIN')" th:href="@{/admin}"
       th:classappend="${active == 'admin'} ? 'active'">Admin</a>
  </nav>
  <!-- Sign out is always there for a signed-in session, even one whose account is gone -->
  <div class="who" sec:authorize="isAuthenticated()">
    <a class="who-name" th:if="${currentUser != null}" th:href="@{/account/password}" title="Change your password" th:text="${currentUser.displayName}">Name</a>
    <span class="badge" th:if="${currentUser != null}" th:text="${currentUser.roleLabel}">Role</span>
    <form th:action="@{/logout}" method="post">
      <button type="submit" class="btn-link">Sign out</button>
    </form>
  </div>
</header>

<!-- One-time messages after a redirect (success, information, error). -->
<div th:fragment="flash" class="flash-area">
  <p class="alert alert-ok" th:if="${flashOk != null}" th:text="${flashOk}">Saved.</p>
  <p class="alert alert-info" th:if="${flashInfo != null}" th:text="${flashInfo}">Note.</p>
  <p class="alert alert-error multiline" th:if="${flashError != null}" th:text="${flashError}">Error.</p>
</div>

<!-- Eye toggle for one group of hidden amounts (see app.js). Hidden by default. -->
<button th:fragment="eye(group)" type="button" class="eye" th:attr="data-eye=${group}"
        aria-pressed="false" title="Show amount" aria-label="Show or hide amount">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
    <path d="M12 5C6.5 5 2.7 8.6 1.5 12c1.2 3.4 5 7 10.5 7s9.3-3.6 10.5-7C21.3 8.6 17.5 5 12 5zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/>
  </svg>
</button>

</body>
</html>
