<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Password')}"></head>
<body>
<header th:replace="~{fragments :: topbar('password')}"></header>

<main class="page page-narrow">
  <div class="page-head">
    <h1>Change your password</h1>
    <a class="btn-link" th:unless="${mustChange}" th:href="@{/}">Cancel</a>
  </div>

  <p class="alert alert-info" th:if="${mustChange}">
    Your password was set by the administrator. Choose your own before continuing — nobody else will know it.
  </p>
  <p class="alert alert-error" th:if="${error != null}" th:text="${error}">Problem</p>

  <form class="card form" th:action="@{/account/password}" method="post" autocomplete="on">
    <label class="field"><span>Current password</span>
      <input type="password" name="current" autocomplete="current-password" required maxlength="200" autofocus></label>
    <label class="field"><span>New password (at least 12 characters)</span>
      <input type="password" name="password" autocomplete="new-password" required minlength="12" maxlength="200"></label>
    <label class="field"><span>Repeat the new password</span>
      <input type="password" name="repeat" autocomplete="new-password" required minlength="12" maxlength="200"></label>
    <p class="muted small">A sentence you can remember is easier and safer than a short word with symbols.</p>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Change password</button>
    </div>
  </form>
</main>
</body>
</html>
