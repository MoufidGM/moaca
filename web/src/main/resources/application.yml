# Production defaults (Ubuntu server). Development overrides live in application-dev.yml.
# Secrets and paths come from environment variables set in /etc/cslsm/cslsm.env.

spring:
  application:
    name: cslsm-web
  main:
    banner-mode: "off"
  datasource:
    # WAL: readers never block the writer; busy_timeout: wait instead of failing on a lock.
    url: jdbc:sqlite:${CSLSM_DB_PATH:/var/lib/cslsm/data/daily_logs.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
    driver-class-name: org.sqlite.JDBC
    hikari:
      pool-name: cslsm
      maximum-pool-size: 4
  flyway:
    # Migrations are run by FlywayConfig with the same Flyway version as the desktop app.
    enabled: false
  thymeleaf:
    cache: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

server:
  # Only nginx on the same machine talks to the app; nothing else can reach this port.
  address: 127.0.0.1
  port: 8080
  # Trust X-Forwarded-Proto/For from nginx on localhost (HTTPS detection, client IP in logs).
  forward-headers-strategy: native
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-exception: false
  servlet:
    session:
      timeout: 60m
      tracking-modes: cookie
      cookie:
        name: CSLSM_SESSION
        http-only: true
        secure: true
        same-site: strict

  tomcat:
    # Read (and discard) oversized uploads so the user gets an error page, not a reset connection.
    max-swallow-size: 70MB

cslsm:
  storage:
    # Daily-log originals and expense receipts. Must be on the encrypted data volume.
    dir: ${CSLSM_FILES_DIR:/var/lib/cslsm/files}
  security:
    # At least 32 characters. Generate with: openssl rand -base64 48
    # Encrypts two-factor secrets stored in the database.
    secret-key: ${CSLSM_SECRET_KEY:}
    totp-issuer: CSLSM
    receptionist-idle-minutes: 15
    admin-idle-minutes: 60
    max-failed-logins: 5
    lockout-minutes: 15

logging:
  level:
    root: INFO
    org.springframework.security: WARN
